name: Build & Release Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    uses: flower7c3/minecraft-addon-github-workflows/github-github-workflows/build-and-release.yml@main
    with:
      project_name: "Bamboo Food"
      has_test_workflow: false
      total_blocks: false
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}